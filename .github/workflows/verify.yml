name: Exact verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the pinned dependency
        run: python -m pip install -r requirements.txt
      - name: Check input validation and failure handling
        run: python -m unittest discover -s tests
      - name: Run the exact computations
        run: python verify.py --output "$RUNNER_TEMP/mw-rank12-results.json"
